name: Sync reading list from Hardcover + cache covers

# Hardcover → src/data/reading.json (live progress), then mirror every cover
# the shelf references into public/covers/. Commits + deploys only on diff.
#
# First switch from the StoryGraph snapshot:
#   gh workflow run sync-hardcover.yml -f takeover=true
# After that the scheduled runs keep it fresh. Without HARDCOVER_TOKEN the
# Hardcover step is a no-op and only the cover cache runs.

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      takeover:
        description: 'Replace the current (StoryGraph/Notion) snapshot with Hardcover'
        type: boolean
        default: false

concurrency:
  group: bot-pushes-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sync from Hardcover
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          HARDCOVER_TAKEOVER: ${{ inputs.takeover && '1' || '' }}
        run: node scripts/sync-hardcover.mjs

      - name: Cache covers
        run: node scripts/cache-covers.mjs

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "reading-bot"
          git config user.email "bot@nasser1931.com"
          git add src/data/reading.json src/data/cover-cache.json public/covers
          if git diff --cached --quiet; then
            echo "No changes — skipping commit and deploy."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync reading list from Hardcover"
          # Fail a stale push rather than rebasing old data over a newer snapshot.
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.commit.outputs.committed == 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.committed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NASSER_PORTFOLIO }}
          channelId: live
          projectId: nasser-portfolio
