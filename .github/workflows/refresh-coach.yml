name: Refresh coach state + workout bank

# Pulls intervals.icu wellness + activities through project-furnace's
# pull_state.py, dumps the canonical workout bank, commits + deploys only
# when the snapshot diff is non-empty. Drives /coach.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [coach-update, bank-update]

# Serialize with sync-paper + refresh-pulse + sync-reading + sync-posts so two
# bots never race to push to main.
concurrency:
  group: bot-pushes-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout project-furnace
        uses: actions/checkout@v4
        with:
          repository: NasserAlbusaidi/project-furnace
          ssh-key: ${{ secrets.PAPER_REPO_SSH_KEY }}
          path: project-furnace
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install requests intervalsicu

      - name: Write intervals.icu creds for pull_state.py
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: |
          umask 077
          printf '{"athlete_id":"%s","api_key":"%s"}\n' "$INTERVALS_ATHLETE_ID" "$INTERVALS_API_KEY" > "$HOME/.intervalsicu_credentials"

      - name: Pull state from intervals.icu → coach.json
        working-directory: project-furnace
        run: python3 tools/intervalsicu/pull_state.py --out "$GITHUB_WORKSPACE/src/data/coach.json" --pretty

      - name: Dump workout bank → workout-bank.json
        working-directory: project-furnace
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/intervalsicu')
          from workout_bank import WORKOUT_LIBRARY
          def default(o):
              if isinstance(o, set): return sorted(o)
              raise TypeError(f"unhandled: {type(o)}")
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "src/data/workout-bank.json")
          with open(out, "w") as f:
              json.dump(WORKOUT_LIBRARY, f, indent=2, default=default, sort_keys=True)
          PY

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "coach-bot"
          git config user.email "bot@nasser1931.com"
          git add src/data/coach.json src/data/workout-bank.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit and deploy."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh coach state"
          git pull --rebase origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.commit.outputs.committed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        if: steps.commit.outputs.committed == 'true'
        run: npm ci

      - name: Build
        if: steps.commit.outputs.committed == 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.committed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NASSER_PORTFOLIO }}
          channelId: live
          projectId: nasser-portfolio
