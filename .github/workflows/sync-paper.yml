name: Sync paper from project-furnace

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [paper-update]

# Serialize with refresh-pulse so two bots never race to push to main.
concurrency:
  group: bot-pushes-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout project-furnace
        uses: actions/checkout@v4
        with:
          repository: NasserAlbusaidi/project-furnace
          ssh-key: ${{ secrets.PAPER_REPO_SSH_KEY }}
          path: project-furnace
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Sync paper prose + figures
        env:
          PAPER_SOURCE: ${{ github.workspace }}/project-furnace/paper
        run: npm run sync-paper

      - name: Refresh paper log
        env:
          PAPER_REPO: ${{ github.workspace }}/project-furnace
        run: npm run refresh-paper-log

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "paper-sync-bot"
          git config user.email "bot@nasser1931.com"
          git add src/pages/paper/index.md public/paper/figures src/data/paper-log.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit and deploy."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync paper from project-furnace"
          # Belt-and-suspenders: rebase against origin in case another bot pushed
          # while we were running. Concurrency group should already prevent this.
          git pull --rebase origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.commit.outputs.committed == 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.committed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NASSER_PORTFOLIO }}
          channelId: live
          projectId: nasser-portfolio
