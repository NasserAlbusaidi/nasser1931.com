<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Jinn</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#050816;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4e9d0}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;transition:transform 1s cubic-bezier(.6,-0.3,.4,1.3)}
  body.flip canvas{transform:rotate(180deg)}
  body.rock canvas{cursor:none}
  #hud{position:fixed;top:12px;left:16px;font-size:13px;letter-spacing:.2em;opacity:.75;pointer-events:none;user-select:none}
  #hud b{font-size:18px;letter-spacing:.35em;color:#ffd77a}
  #hud span{display:block;margin-top:4px;letter-spacing:.1em}
  #mute{position:fixed;top:12px;right:16px;font-size:12px;opacity:.55;cursor:pointer;user-select:none;letter-spacing:.1em}
  #ui{position:fixed;left:50%;bottom:calc(60px + 16vh);transform:translate(-50%,20px);width:min(560px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
  #ui.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #f{display:flex;gap:8px;background:rgba(10,8,30,.75);border:1px solid rgba(255,215,122,.45);border-radius:14px;padding:6px;box-shadow:0 0 30px rgba(90,255,220,.15);backdrop-filter:blur(6px)}
  #w{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:17px;padding:8px 10px}
  #w::placeholder{color:rgba(244,233,208,.45)}
  #f button{background:linear-gradient(#ffe08a,#c98f22);color:#2a1700;border:0;border-radius:10px;font-weight:800;letter-spacing:.15em;padding:0 16px;cursor:pointer;font-size:14px}
  #chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
  #chips button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#f4e9d0;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
  #chips button:hover{background:rgba(255,215,122,.2)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>JINN</b><span id="wl"></span></div>
<div id="mute">[M] sound: on</div>
<div id="ui"><div id="chips"></div><form id="f" autocomplete="off"><input id="w" maxlength="60" placeholder="I wish..."><button>WISH</button></form></div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ui=document.getElementById('ui'),inp=document.getElementById('w'),form=document.getElementById('f'),chipsEl=document.getElementById('chips');
const wlEl=document.getElementById('wl'),muteEl=document.getElementById('mute');
let W=0,H=0,DPR=1,floorY=0,G={},sky=null,stars=[];
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.random()*a.length|0];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- audio ---------------- */
let AC=null,master=null,noiseBuf=null,muted=false;
function audio(){
  if(AC)return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
  return AC;
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,.005,vol,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,ft,f0,f1,q=1,delay=0,att=.01){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=ft;f.Q.value=q;f.frequency.setValueAtTime(f0,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();env(g,t,att,vol,dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+att+.05);
}
const sfx={
  squeak(sp){noise(.07,.05,'bandpass',900+sp*8,1400+sp*10,8)},
  boom(){tone('sine',110,28,1.1,.7);noise(1.2,.35,'lowpass',300,4000,1,0,.05);noise(.6,.2,'lowpass',2000,200,1,.2)},
  suck(){noise(1.2,.3,'lowpass',4000,150,1,0,.3);tone('sine',300,60,1.2,.15)},
  blip(angry){const b=angry?120:190;tone('square',b*(.8+Math.random()*.7),null,.045,.025);tone('triangle',b*2*(.9+Math.random()*.4),null,.04,.03)},
  clink(){tone('sine',rand(2200,3400),null,.12,.05);tone('sine',rand(4000,5200),null,.06,.02)},
  sizzle(){noise(.25,.06,'highpass',4000,8000,1)},
  squish(){noise(.12,.25,'lowpass',1200,200,2);tone('sine',180,60,.12,.2)},
  pop(){tone('sine',600,1400,.08,.12)},
  flash(){tone('sawtooth',80,600,.5,.08);noise(.5,.12,'bandpass',500,5000,4)},
  meh(){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=310;l.frequency.value=11;lg.gain.value=40;l.connect(lg);lg.connect(o.frequency);
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=2;
    env(g,t,.03,.25,.7);o.connect(f);f.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+.8);l.stop(t+.8)},
  vroom(){tone('sawtooth',900,1800,.5,.03);tone('square',1200,2400,.5,.015)},
  rage(){tone('sawtooth',90,45,1.2,.25);noise(1,.25,'lowpass',600,100,1)},
  chime(){[523,659,784,1047].forEach((f,i)=>tone('sine',f,null,.6,.08,i*.09))}
};
let clinkT=0,sizzleT=0,squeakT=0;
function toggleMute(){muted=!muted;muteEl.textContent='[M] sound: '+(muted?'off':'on')}
muteEl.onclick=toggleMute;

/* ---------------- sprites ---------------- */
const COLS=[[90,255,215],[175,110,255],[255,70,50],[255,205,90],[230,230,240]];
const sprites=COLS.map(([r,g,b])=>{
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);gr.addColorStop(.35,`rgba(${r},${g},${b},.45)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,64,64);return c;
});

/* ---------------- layout ---------------- */
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR|0;cv.height=H*DPR|0;ctx.setTransform(DPR,0,0,DPR,0,0);
  floorY=H-50;
  const LS=clamp(Math.min(W,H)/750,.6,1.25),lx=W/2,ly=floorY-26*LS;
  G={LS,lx,ly,sx:lx+120*LS,sy:ly-40*LS,x0:lx-120*LS,x1:lx+130*LS,y0:ly-70*LS,y1:ly+35*LS};
  buildSky();
}
function buildSky(){
  sky=document.createElement('canvas');sky.width=W*DPR|0;sky.height=H*DPR|0;
  const x=sky.getContext('2d');x.scale(DPR,DPR);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#04061a');g.addColorStop(.55,'#160f3a');g.addColorStop(.85,'#3b1e4f');g.addColorStop(1,'#5a2a4a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // moon
  const mx=W*.82,my=H*.17,mr=Math.min(W,H)*.045+10;
  const mc=document.createElement('canvas');mc.width=mc.height=mr*4;const m=mc.getContext('2d');
  m.fillStyle='#fff3cf';m.beginPath();m.arc(mr*2,mr*2,mr,0,7);m.fill();
  m.globalCompositeOperation='destination-out';m.beginPath();m.arc(mr*2+mr*.45,mr*2-mr*.2,mr*.92,0,7);m.fill();
  x.shadowColor='rgba(255,240,200,.8)';x.shadowBlur=30;x.drawImage(mc,mx-mr*2,my-mr*2);x.shadowBlur=0;
  // dunes
  x.fillStyle='#1d1233';x.beginPath();x.moveTo(0,floorY);
  for(let i=0;i<=W;i+=8)x.lineTo(i,floorY-40-Math.sin(i*.006)*30-Math.sin(i*.017+1)*12);
  x.lineTo(W,floorY);x.fill();
  x.fillStyle='#140c26';x.beginPath();x.moveTo(0,floorY);
  for(let i=0;i<=W;i+=8)x.lineTo(i,floorY-14-Math.sin(i*.01+3)*14);
  x.lineTo(W,floorY);x.fill();
  const sg=x.createLinearGradient(0,floorY,0,H);sg.addColorStop(0,'#2b1b3d');sg.addColorStop(1,'#120b1f');
  x.fillStyle=sg;x.fillRect(0,floorY,W,H-floorY);
  stars=[];for(let i=0;i<Math.min(260,W*H/4500);i++)stars.push({x:rand(W),y:rand(floorY-60),r:rand(.4,1.6),p:rand(7),s:rand(.5,2.5)});
}
addEventListener('resize',resize);resize();

/* ---------------- state ---------------- */
let state='asleep';           // asleep | awake
let energy=0,lampSulk=false,summons=0,freed=0,lastAngry=false;
let wishesLeft=3,busy=false,time=0,shake=0,lastInteract=0,snoreT=0,idleT=0,squashed=0,squashCommented=false;
const P=[];      // smoke
const props=[];  // emoji / coins / letters
const J={x:0,y:0,vx:0,vy:0,scale:0,visible:false,leaving:false,up:false,anger:0,flash:0,gold:false,blink:0,mouth:0};
let speech=null;
let mouse={x:W/2,y:H/2,down:false,px:W/2,py:H/2};
let rock=null;
function updHUD(){wlEl.textContent=state==='awake'?'wishes: '+'✦'.repeat(Math.max(0,wishesLeft))+'·'.repeat(3-Math.max(0,wishesLeft)):(lampSulk?'the lamp is sulking':'')}
updHUD();

/* ---------------- smoke ---------------- */
function smoke(x,y,vx,vy,size,life,c,a=1){
  if(P.length>2600)return;
  P.push({x,y,vx,vy,size,life,max:life,c,a});
}
function jinnCols(){
  if(J.gold)return[3,3];
  if(J.anger>=3)return[2,J.anger>=4?2:(summons%2?1:0)];
  return summons%2?[1,0]:[0,1];
}

/* ---------------- speech ---------------- */
function say(text,keep){
  if(speech&&speech.res)speech.res();
  return new Promise(res=>{speech={text,shown:0,hold:0,res,fade:1,done:false,keep};lastInteract=time});
}
function updSpeech(dt){
  if(!speech)return;
  const s=speech,L=s.text.length;
  if(s.shown<L){
    const before=s.shown|0;s.shown=Math.min(L,s.shown+dt*40);
    const after=s.shown|0;
    for(let i=before;i<after;i++)if(i%2===0&&/\w/.test(s.text[i]))sfx.blip(J.anger>=3);
    J.mouth=/[aeiouAEIOU]/.test(s.text[after]||'')?1:.45;
  }else{
    J.mouth*=.8;s.hold+=dt;
    if(!s.done&&s.hold>.8+L*.03){s.done=true;const r=s.res;s.res=null;r&&r()}
    if(s.done&&!s.keep){s.fade-=dt*.6;if(s.fade<=0)speech=null}
  }
}
function wrap(text,maxW){
  const words=text.split(' '),lines=[];let line='';
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);return lines;
}
function drawSpeech(){
  if(!speech||!J.visible)return;
  const s=speech,R=headR();
  ctx.save();ctx.globalAlpha=clamp(s.fade,0,1);
  ctx.font='600 17px system-ui,-apple-system,"Segoe UI",sans-serif';
  const maxW=Math.min(300,W-60),lines=wrap(s.text,maxW);
  const lh=23,bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+28,bh=lines.length*lh+20;
  const right=J.x<W*.55;
  let bx=right?J.x+R*.9:J.x-R*.9-bw,by=J.y-R*1.1-bh*.5;
  bx=clamp(bx,10,W-bw-10);by=clamp(by,10,H-bh-140);
  const tx=J.x+(right?R*.55:-R*.55),ty=J.y-R*.35;
  ctx.fillStyle=J.anger>=3?'#ffe3dc':'#fffaf0';ctx.strokeStyle='#1a0f2a';ctx.lineWidth=3;
  const ax=clamp(tx,bx+24,bx+bw-24),ay=by+bh/2;
  ctx.beginPath();ctx.moveTo(ax-12,ay);ctx.lineTo(tx,ty);ctx.lineTo(ax+12,ay);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,bw,bh,14):ctx.rect(bx,by,bw,bh);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a0f2a';ctx.textBaseline='top';ctx.textAlign='left';
  let left=s.shown|0;
  lines.forEach((l,i)=>{if(left<=0)return;const part=l.slice(0,left);left-=l.length+1;ctx.fillText(part,bx+14,by+11+i*lh)});
  ctx.restore();
}

/* ---------------- props ---------------- */
function prop(o){if(props.length>500)props.shift();props.push(Object.assign({x:0,y:0,vx:0,vy:0,rot:0,vr:0,size:28,life:20,max:20,seed:rand(100),age:0},o));}
function updProps(dt){
  for(let i=props.length-1;i>=0;i--){
    const p=props[i];p.age+=dt;p.life-=dt;
    if(p.life<=0){props.splice(i,1);continue}
    const half=p.size*.42;
    switch(p.type){
      case 'fall':{
        p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
        if(p.y>floorY-half){p.y=floorY-half;if(Math.abs(p.vy)>90&&p.coin&&time-clinkT>.04){sfx.clink();clinkT=time}p.vy*=-.35;p.vx*=.75;p.vr*=.6;if(Math.abs(p.vy)<20)p.vy=0}
        if(p.x<half){p.x=half;p.vx*=-.6}if(p.x>W-half){p.x=W-half;p.vx*=-.6}
        break}
      case 'float':p.y-=(p.speed||45)*dt;p.x+=Math.sin(time*2+p.seed)*30*dt;p.rot=Math.sin(time*3+p.seed)*.3;break;
      case 'walk':p.x+=p.vx*dt;p.y=floorY-half-Math.abs(Math.sin(p.age*9))*5;if(p.x<-80||p.x>W+80)p.life=0;
        if(p.meh&&p.age>p.nextMeh){sfx.meh();p.nextMeh=p.age+rand(1.5,3)}break;
      case 'follow':{
        const dx=mouse.x-p.x+Math.sin(p.seed+time)*30,dy=mouse.y-p.y+Math.cos(p.seed*1.3+time)*30,d=Math.hypot(dx,dy)||1;
        p.vx+=(dx/d*260-p.vx)*2.5*dt+rand(-60,60)*dt*10;p.vy+=(dy/d*260-p.vy)*2.5*dt+rand(-60,60)*dt*10;
        p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot=Math.atan2(p.vy,p.vx)+Math.PI;break}
      case 'crawl':{
        p.h=(p.h??rand(7))+rand(-4,4)*dt*3;const sp=p.speed||70;
        p.x+=Math.cos(p.h)*sp*dt;p.y+=Math.sin(p.h)*sp*dt;
        if(p.x<20||p.x>W-20)p.h=Math.PI-p.h;if(p.y<20||p.y>floorY)p.h=-p.h;
        p.x=clamp(p.x,20,W-20);p.y=clamp(p.y,20,floorY);p.rot=p.h+Math.PI/2;break}
      case 'snow':
        p.y+=p.vy*dt;p.x+=Math.sin(time*1.5+p.seed)*25*dt;
        if(p.y>p.melt){
          smoke(p.x,p.y,rand(-10,10),-40,rand(18,32),rand(.6,1),4,.5);
          if(time-sizzleT>.07){sfx.sizzle();sizzleT=time}p.life=0}
        break;
      case 'splat':break;
    }
  }
}
function drawProps(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of props){
    ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    if(p.coin){
      const sq=Math.abs(Math.cos(p.seed+p.age*6*(p.vy?1:0)));
      ctx.scale(Math.max(.25,p.vy?sq:1),1);
      ctx.fillStyle='#e8b23a';ctx.strokeStyle='#7a5210';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,p.size/2,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(-p.size*.12,-p.size*.12,p.size*.18,0,7);ctx.fill();
    }else if(p.type==='splat'){
      ctx.fillStyle='rgba(120,200,40,.75)';ctx.beginPath();
      for(let k=0;k<10;k++){const a=k/10*6.283,r=p.size*(.35+((p.seed*7+k*13)%10)/22);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
      ctx.fill();
    }else if(p.letter){
      ctx.font=`900 ${p.size}px system-ui,sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='#2a1700';ctx.strokeText(p.ch,0,0);
      ctx.fillStyle='#ffd77a';ctx.fillText(p.ch,0,0);
    }else if(p.type==='snow'){
      ctx.fillStyle='#fff';ctx.globalAlpha*=.9;ctx.beginPath();ctx.arc(0,0,p.size/2,0,7);ctx.fill();
    }else{
      if(p.flipX)ctx.scale(-1,1);
      ctx.font=`${p.size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif`;ctx.fillText(p.ch,0,0);
    }
    ctx.restore();
  }
}

/* ---------------- lamp ---------------- */
function drawLamp(){
  const {LS,lx,ly}=G,e=energy/100;
  const sx=state==='asleep'?(Math.random()-.5)*e*e*10:0,sy=state==='asleep'?(Math.random()-.5)*e*e*6:0;
  ctx.save();ctx.translate(lx+sx,ly+sy);ctx.scale(LS,LS);
  if(e>0&&state==='asleep'){ctx.shadowColor=`rgba(110,255,220,${.3+e*.6})`;ctx.shadowBlur=10+e*60}
  const gold=ctx.createLinearGradient(0,-50,0,30);gold.addColorStop(0,'#fff0b0');gold.addColorStop(.35,'#f0c050');gold.addColorStop(.75,'#b07a18');gold.addColorStop(1,'#5e3c08');
  ctx.lineJoin='round';ctx.strokeStyle='#2e1c04';ctx.lineWidth=2.5;
  // handle
  ctx.lineWidth=11;ctx.strokeStyle='#2e1c04';ctx.beginPath();ctx.moveTo(-62,-12);ctx.bezierCurveTo(-120,-40,-122,26,-60,12);ctx.stroke();
  ctx.lineWidth=6.5;ctx.strokeStyle='#d9a13a';ctx.stroke();
  ctx.lineWidth=2.5;ctx.strokeStyle='#2e1c04';ctx.fillStyle=gold;
  // spout
  ctx.beginPath();ctx.moveTo(48,-14);ctx.quadraticCurveTo(92,-14,108,-30);ctx.quadraticCurveTo(116,-42,126,-44);
  ctx.quadraticCurveTo(128,-34,118,-24);ctx.quadraticCurveTo(96,8,50,12);ctx.closePath();ctx.fill();ctx.stroke();
  // foot
  ctx.beginPath();ctx.ellipse(0,24,36,8,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillRect(-16,14,32,10);
  // body
  ctx.beginPath();ctx.ellipse(0,0,72,24,0,0,7);ctx.fill();ctx.stroke();
  // lid
  ctx.beginPath();ctx.ellipse(0,-22,32,12,0,Math.PI,0);ctx.lineTo(32,-20);ctx.ellipse(0,-20,32,5,0,0,Math.PI);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-4,-33);ctx.lineTo(-3,-40);ctx.lineTo(3,-40);ctx.lineTo(4,-33);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-45,7,0,7);ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;
  // band + gem
  ctx.strokeStyle='rgba(60,35,5,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-4,70,16,0,.15,Math.PI-.15);ctx.stroke();
  ctx.fillStyle=state==='asleep'&&e>0?`rgb(${80+175*e|0},255,${200+55*e|0})`:'#c0263a';ctx.strokeStyle='#2e1c04';
  ctx.beginPath();ctx.moveTo(0,4);ctx.lineTo(7,11);ctx.lineTo(0,18);ctx.lineTo(-7,11);ctx.closePath();ctx.fill();ctx.stroke();
  // shine
  ctx.fillStyle='rgba(255,255,240,.45)';ctx.beginPath();ctx.ellipse(-28,-11,20,4.5,-.08,0,7);ctx.fill();
  ctx.restore();
  // shadow on ground
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(G.lx,floorY+2,95*LS,8*LS,0,0,7);ctx.fill();
}

/* ---------------- jinn ---------------- */
const headR=()=>62*G.LS*Math.max(.05,J.scale)*(J.anger>=5?1.25:1);
function updJinn(dt){
  if(!J.visible)return;
  let tx,ty;
  const bob=Math.sin(time*1.7)*14;
  if(J.leaving){tx=G.sx;ty=G.sy;J.scale=Math.max(0,J.scale-dt*.85)}
  else if(J.up){tx=J.x+Math.sin(time*3)*40;ty=-400;J.vy-=300*dt}
  else{
    J.scale=Math.min(1,J.scale+dt*1.2);
