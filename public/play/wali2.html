<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wali II</title>
<style>
  :root{
    --bg:#0b0907; --bar:#15110d; --bar2:#221b14; --line:#3a2e22; --ink:#f3e6cf; --dim:#a8977c; --hot:#ff8a3d;
    --good:#8fd16a; --bad:#ff5a4e; --blue:#6fb3ff; --gold:#ffd23d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:12.5px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  b{font-weight:600}
  #app{display:grid;grid-template-columns:184px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr) 190px;height:100vh}
  #top{grid-column:1/4;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 10px;background:var(--bar2);border-bottom:1px solid var(--line)}
  #top h1{margin:0;font-size:16px;letter-spacing:.3em;color:var(--gold)}
  #top .k{color:var(--dim);font-size:11px}
  #top .v{font-variant-numeric:tabular-nums}
  #top .grp{display:flex;gap:4px;align-items:center}
  #tools{grid-row:2/4;overflow:auto;background:var(--bar);border-right:1px solid var(--line);padding:6px}
  #tools .cat{color:var(--dim);font-size:10.5px;letter-spacing:.15em;margin:8px 2px 3px}
  .tb{display:flex;justify-content:space-between;gap:6px;width:100%;margin:2px 0;border:1px solid var(--line);background:#1c1610;color:var(--ink);border-radius:5px;padding:4px 6px;cursor:pointer;font:inherit;text-align:left}
  .tb small{color:var(--gold)}
  .tb:hover:not(:disabled){border-color:#6b5640}
  .tb.on{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot) inset;background:#2a1d12}
  .tb:disabled{opacity:.4;cursor:not-allowed}
  #mapwrap{position:relative;background:#000;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  #mapbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  #map{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
  #tip{position:absolute;left:8px;bottom:8px;background:#000c;padding:5px 8px;border-radius:5px;max-width:70%;pointer-events:none;white-space:pre-line}
  #tip:empty{display:none}
  #banner{position:absolute;left:8px;top:8px;background:#000b;padding:5px 9px;border-radius:5px;pointer-events:none;max-width:60%}
  #toast{position:absolute;right:10px;top:10px;max-width:42%;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
  .t{background:#000d;border-left:3px solid var(--hot);padding:4px 8px;border-radius:4px;animation:fade 5s forwards}
  .t.good{border-left-color:var(--good)} .t.ev{border-left-color:var(--gold)}
  @keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #ovl{display:flex;gap:3px;flex-wrap:wrap;padding:4px 6px;background:var(--bar);border-bottom:1px solid var(--line)}
  #ovl .btn{padding:2px 7px;font-size:11px}
  .btn{border:1px solid var(--line);background:#1c1610;color:var(--ink);border-radius:5px;padding:4px 8px;cursor:pointer;font:inherit}
  .btn.on{border-color:var(--hot);background:#2a1d12}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  #side{grid-row:2/4;grid-column:3;overflow:auto;background:linear-gradient(var(--bar2),var(--bar));border-left:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
  .lbl{color:var(--dim);font-size:10.5px;letter-spacing:.15em;margin-top:8px}
  .fac{margin:3px 0}
  .fac .top{display:flex;justify-content:space-between}
  .bar{height:7px;background:#2a2118;border-radius:4px;overflow:hidden;position:relative;margin:2px 0}
  .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px}
  .bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fffa}
  .why{color:var(--dim);font-size:10.5px;min-height:12px}
  .why .n{color:#ffb4a8} .why .p{color:#c8f0a8}
  .grid2{display:grid;grid-template-columns:1fr auto;gap:1px 10px}
  .grid2 span{color:var(--dim)} .grid2 b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  .bad{color:var(--bad)!important} .ok{color:var(--good)!important} .warn{color:var(--hot)!important}
  #dir{border:1px solid #5a4a20;background:#1f1a0c;border-radius:6px;padding:6px 8px}
  #dir:empty{display:none}
  .ed{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #2a2118}
  .ed .nm{display:flex;flex-direction:column}
  .ed small{color:var(--dim);font-size:10.5px}
  .seg{display:flex;gap:2px}
  .seg .btn{padding:2px 6px;font-size:11px}
  #sel{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#140f0b}
  #sel:empty{display:none}
  #logwrap{grid-column:2;grid-row:3;display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:0}
  .hd{padding:4px 10px;color:var(--dim);border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.15em}
  #log{flex:1;overflow:auto;padding:4px 10px}
  #log div{padding:2px 0;border-bottom:1px dashed #241c14}
  #log .d{color:var(--dim);margin-right:6px}
  #log .b{color:#ffb4a8} #log .g{color:#c8f0a8} #log .m{color:var(--ink)} #log .e{color:var(--gold)}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.show{display:flex}
  .card{background:linear-gradient(var(--bar2),var(--bar));border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:560px;width:100%;box-shadow:0 20px 60px #000;max-height:92vh;overflow:auto}
  .card h2{margin:0 0 4px;letter-spacing:.12em;font-size:18px;color:var(--gold)}
  .card .sub{color:var(--dim);font-size:11px;letter-spacing:.15em;margin-bottom:10px}
  .card p{margin:0 0 12px;line-height:1.45}
  .card .opts{display:flex;flex-direction:column;gap:6px}
  .card .opts .btn{display:flex;flex-direction:column;gap:2px;padding:8px 10px;text-align:left}
  .card .opts small{color:var(--dim)}
  .card.lose h2{color:var(--bad)} .card.win h2{color:var(--good)}
  .stats{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin:0 0 14px;color:var(--dim)}
  .stats b{color:var(--ink);text-align:right}
  canvas.spark{width:100%;height:40px;display:block}
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto;height:auto}
    #top{grid-column:1}
    #tools{grid-row:auto;display:flex;gap:4px;overflow-x:auto;white-space:nowrap}
    #tools .cat{display:none}
    .tb{width:auto;flex:0 0 auto}
    #mapbox{min-height:0;display:block}
    #toast{display:none}
    #side,#logwrap{grid-column:1;grid-row:auto}
    #logwrap{height:220px}
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>WALI II</h1>
    <div class="grp"><span class="k">WILAYAT</span><b id="town"></b></div>
    <div class="grp"><b id="date"></b></div>
    <div class="grp" id="speed"></div>
    <div class="grp"><span class="k">TREASURY</span><b class="v" id="tTr"></b></div>
    <div class="grp"><span class="k">WASTA</span><b class="v" id="tPc"></b></div>
    <div class="grp"><span class="k">MUSCAT</span><b class="v" id="tFav"></b></div>
    <div class="grp"><span class="k">HEAT</span><b class="v" id="tHeat"></b></div>
    <div class="grp"><span class="k">RAIN</span><b class="v" id="tRain"></b></div>
  </header>
  <aside id="tools"></aside>
  <main id="mapwrap">
    <div id="ovl"></div>
    <div id="mapbox"><canvas id="map" width="768" height="512"></canvas>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="tip"></div></div>
  </main>
  <aside id="side">
    <div class="lbl">APPROVAL · ELECTION NEEDS 50%</div>
    <div class="fac"><div class="top"><b>Overall</b><b id="apN"></b></div><div class="bar"><i id="apBar"></i><span class="mk" style="left:50%"></span></div><div class="why" id="apWhy"></div></div>
    <div id="facs"></div>
    <canvas class="spark" id="spark"></canvas>
    <div class="lbl">MUSCAT WANTS</div>
    <div id="dir"></div>
    <div class="lbl">THE TOWN</div>
    <div class="grid2" id="city"></div>
    <div class="lbl">EDICTS · COST WASTA</div>
    <div id="edicts"></div>
    <div class="lbl">SELECTED</div>
    <div id="sel"></div>
    <div class="lbl">LAST MONTH'S BOOKS</div>
    <div class="grid2" id="books"></div>
  </aside>
  <section id="logwrap"><div class="hd">WHAT THE FUCK JUST HAPPENED</div><div id="log"></div></section>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=Math.random;
const rnd=(a=1,b)=>b===undefined?R()*a:a+R()*(b-a);
const pick=a=>a[Math.floor(R()*a.length)];
const f0=v=>Math.round(v).toLocaleString();
const sg=v=>(v>=0?'+':'')+Math.round(v);
const MW=48,MH=32,TS=16,TERM=1460,TERMS=3;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TOWNS=['Hara','Wadi Bani Nothing','Al Hamra Al Sughra','Sinaw Junior','Bilad Al Goats','Al Mudhaibi-ish'];

// ================= building catalogue =================
// c cost(k OMR) up upkeep(k/month) bd build days, cap residents, jobs, pow MW out, pw MW in, water +out / -in, r radius, cov kind, capR residents served, poll pollution
const T={
  road:    {n:'Road',cat:'ROADS',c:2,up:.02,w:1,h:1,bd:3,road:true,d:'Connects buildings to the highway. On the wadi bed it becomes a ford, which floods.'},
  bridge:  {n:'Wadi bridge',cat:'ROADS',c:22,up:.1,w:1,h:1,bd:25,road:true,onlyWadi:true,d:'A road across the wadi that survives the wadi. Wadi tiles only.'},
  house:   {n:'Houses',cat:'HOUSING',c:6,up:.05,w:1,h:1,bd:20,cap:10,pw:0,d:'10 people. Flat roof, water tank, satellite dish.'},
  villa:   {n:'Villas',cat:'HOUSING',c:28,up:.2,w:2,h:2,bd:35,cap:24,pw:1,rich:1,d:'24 people who pay triple fees. Merchants approve.'},
  flats:   {n:'Apartment block',cat:'HOUSING',c:42,up:.5,w:2,h:2,bd:50,cap:90,pw:3,d:'90 people stacked up. Elders call it "Muscat creep".'},
  falaj:   {n:'Falaj channel',cat:'WATER & POWER',c:8,up:.2,w:1,h:1,bd:15,water:6,noRoad:true,d:'+6 water at a full aquifer, less as it drops. Must touch the wadi or the mountain.'},
  well:    {n:'Borewell',cat:'WATER & POWER',c:12,up:.3,w:1,h:1,bd:8,water:10,noRoad:true,d:'+10 water, flat, until the aquifer is gone. Drains it fast. Elders hate it.'},
  tanker:  {n:'Tanker depot',cat:'WATER & POWER',c:20,up:7,w:2,h:2,bd:10,water:22,jobs:6,d:'+22 water trucked in from the coast. Brutal running cost.'},
  dam:     {n:'Recharge dam',cat:'WATER & POWER',c:110,up:1,w:2,h:2,bd:90,noRoad:true,needWadi:2,d:'Catches floods: refills the aquifer and shields everything downstream. Must sit on the wadi.'},
  genset:  {n:'Diesel generators',cat:'WATER & POWER',c:30,up:2.5,w:2,h:2,bd:20,pow:60,jobs:5,poll:3,d:'+60 MW. Smells like a bus station.'},
  solar:   {n:'Solar farm',cat:'WATER & POWER',c:75,up:.4,w:3,h:3,bd:45,pow:55,noRoad:true,d:'+55 MW, nearly free to run. Useless in a dust storm.'},
  grid:    {n:'National grid link',cat:'WATER & POWER',c:160,up:3,w:2,h:2,bd:120,pow:200,one:true,needFav:65,d:'+200 MW from Muscat. Needs Muscat favour 65+ to even ask.'},
  depot:   {n:'Garbage depot',cat:'WATER & POWER',c:30,up:2,w:2,h:2,bd:25,jobs:8,poll:2,d:'Trucks for the trash. The cats file a complaint.'},
  school:  {n:'School',cat:'SERVICES',c:35,up:2.5,w:2,h:2,bd:50,jobs:14,pw:2,r:9,cov:'edu',capR:450,d:'Covers 450 residents in range.'},
  clinic:  {n:'Health centre',cat:'SERVICES',c:45,up:3,w:2,h:2,bd:55,jobs:12,pw:2,r:10,cov:'health',capR:600,d:'Covers 600 residents. Fewer people living on the toilet.'},
  police:  {n:'Police post',cat:'SERVICES',c:18,up:1.5,w:1,h:1,bd:20,jobs:8,r:10,cov:'police',capR:700,d:'Fewer drifters, less crime. Covers 700.'},
  mosque:  {n:'Mosque',cat:'SERVICES',c:25,up:.5,w:2,h:2,bd:40,jobs:2,pw:1,r:8,cov:'faith',capR:500,d:'Elders\' favourite building. Covers 500.'},
  park:    {n:'Majlis garden',cat:'SERVICES',c:6,up:.3,w:1,h:1,bd:10,r:5,cov:'fun',capR:120,water:-.6,noRoad:true,d:'Shade, benches, an old man asleep. Covers 120. Drinks water.'},
  pitch:   {n:'Football pitch',cat:'SERVICES',c:22,up:.8,w:2,h:2,bd:25,jobs:2,pw:1.5,r:9,cov:'fun',capR:500,water:-1,d:'Covers 500 with fun. Youth love it. Floodlights eat power.'},
  souq:    {n:'Souq',cat:'ECONOMY',c:30,up:1,w:2,h:2,bd:30,jobs:22,pw:2,d:'22 jobs and rent, if there are enough shoppers. Merchants\' happy place.'},
  shawarma:{n:'Shawarma stand',cat:'ECONOMY',c:5,up:.1,w:1,h:1,bd:5,jobs:3,pw:.6,d:'Youth +, trash +. Food poisoning during blackouts.'},
  farm:    {n:'Date farm',cat:'ECONOMY',c:20,up:.6,w:2,h:2,bd:30,jobs:10,water:-5,noRoad:true,d:'Exports dates. Drinks 5 water. Double output on oasis soil.'},
  goats:   {n:'Goat pens',cat:'ECONOMY',c:10,up:.2,w:2,h:2,bd:10,jobs:4,water:-1,noRoad:true,d:'Herders love it. +50 goats. Goats do not respect fences.'},
  quarry:  {n:'Quarry',cat:'ECONOMY',c:50,up:1.5,w:3,h:3,bd:40,jobs:30,pw:4,poll:7,onRock:3,d:'Big money, big jobs, big dust. Must bite into the mountain.'},
  petrol:  {n:'Petrol station',cat:'ECONOMY',c:25,up:.5,w:1,h:1,bd:20,jobs:4,pw:.5,d:'Money from every Land Cruiser in town.'},
  hotel:   {n:'Heritage hotel',cat:'ECONOMY',c:70,up:2,w:2,h:2,bd:60,jobs:16,pw:3,water:-2,d:'Tourist money, scales with attractions (fort, dallah, ski slope).'},
  dallah:  {n:'Giant dallah',cat:'VANITY',c:35,up:.2,w:1,h:1,bd:20,attr:10,max:3,d:'A 9-metre coffee pot. Everyone pretends to hate it. Tourists love it.'},
  ski:     {n:'Indoor ski slope',cat:'VANITY',c:450,up:6,w:3,h:3,bd:150,jobs:40,pw:45,water:-4,attr:90,one:true,d:'In the interior. At 47°. You absolute madman.'},
  // non-buildable
  hwy:     {n:'Highway to Muscat',w:1,h:1,road:true,fixed:true,up:0},
  ruin:    {n:'Ruined fort',w:3,h:3,fixed:true,noRoad:true,up:0,d:'300 years old. Currently a goat hotel.'},
  fort:    {n:'Restored fort',w:3,h:3,fixed:true,bd:70,jobs:6,attr:35,up:1,d:'Tourists, pride, Instagram.'},
};
const CATS=['ROADS','HOUSING','WATER & POWER','SERVICES','ECONOMY','VANITY'];
const COVS=[['edu','School'],['health','Health'],['police','Police'],['faith','Mosque'],['fun','Leisure']];
const FACS=[
  {k:'elders',n:'Elders',sh:.2,c:'#e8d6a8'},
  {k:'youth',n:'Youth',sh:.3,c:'#6fb3ff'},
  {k:'merchants',n:'Merchants',sh:.2,c:'#ffd23d'},
  {k:'farmers',n:'Farmers & herders',sh:.3,c:'#8fd16a'},
];
const EDICTS=[
  {k:'fees',n:'Municipal fees',opts:['Low','Normal','High'],pc:10,d:'Low: everyone happier, less money. High: merchants riot.'},
  {k:'goatp',n:'Goat permits',opts:['Few','Normal','Unlimited'],pc:10,d:'Herders want unlimited. Grass does not.'},
  {k:'subsidy',n:'Electricity subsidy',opts:['Off','On'],pc:15,d:'Cheap power: happier people, colder majlis, bigger grid load, costs money.'},
  {k:'curfew',n:'Youth curfew',opts:['Off','On'],pc:15,d:'No drifting after 11pm. Less crime. Youth furious, elders delighted.'},
  {k:'friday',n:'Friday market',opts:['Off','On'],pc:10,d:'2k/month. Merchants and farmers like it.'},
  {k:'hamad',n:'Cousin Hamad builds',opts:['Off','On'],pc:0,pcOff:25,d:'Builds twice as fast, +30% cost, +wasta. Scandal brewing. Firing family costs 25.'},
];

// ================= state =================
let S,terr,tv,occ,wadiX,conn,poll,dirty=true;
const isWadi=(x,y)=>inb(x,y)&&terr[y*MW+x]===2;
const inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const T_=b=>T[b.t];
function newGame(seed){
  S={seed:seed??(Math.random()*1e9|0)};
  R=mulberry(S.seed);
  Object.assign(S,{day:0,term:1,treasury:220,pc:30,favour:50,aquifer:68,grass:55,trash:12,cats:8,feral:0,crime:18,pop:0,
    ed:{fees:1,goatp:1,subsidy:0,curfew:0,friday:0,hamad:0},mods:[],sat:{elders:56,youth:56,merchants:56,farmers:56},approval:56,
    b:[],nid:1,nextEvent:45,events:0,bo:[],flow:0,floodHit:false,swallowed:0,scandal:0,dir:null,nextDir:100,
    lowFav:0,lowApp:0,acExtra:0,warned:false,ended:null,pending:null,hist:{ap:[],tr:[]},books:null,town:pick(TOWNS),
    stat:{blackouts:0,floods:0,destroyed:0,dirsWon:0,dirsLost:0,built:0,peakPop:0,scandals:0},HB:50,Hwhy:[],fwhy:{}});
  S.W={heat:22,rain:8,storm:0,stormRain:0,wave:0,waveAdd:0,dust:0};
  for(let tries=0;tries<20;tries++){S.b=[];S.nid=1;genMap();seedTown();if(S.b.filter(b=>b.t==='house').length>=26&&S.b.filter(b=>b.t==='falaj').length>=3)break;}
  recompute();
  S.pop=Math.round(capacity()*0.95);
  dirty=true; recompute(); S.C=calc();
  for(const f of FACS)S.sat[f.k]=facTarget(f.k);
  S.approval=FACS.reduce((a,f)=>a+f.sh*S.sat[f.k],0);
  return S;
}
function genMap(){
  terr=new Uint8Array(MW*MH); tv=new Float32Array(MW*MH); occ=new Int32Array(MW*MH); wadiX=[];
  for(let i=0;i<MW*MH;i++)tv[i]=R();
  let m=4;
  for(let x=0;x<MW;x++){ if(R()<.6)m=clamp(m+(R()<.5?-1:1),2,7); for(let y=0;y<m;y++)terr[y*MW+x]=1; }
  // eastern ridge
  let e=3;
  for(let y=0;y<MH-3;y++){ if(R()<.5)e=clamp(e+(R()<.5?-1:1),1,6); for(let x=MW-e;x<MW;x++)terr[y*MW+x]=1; }
  // an outcrop
  const ox=Math.floor(rnd(26,36)),oy=Math.floor(rnd(9,20));
  for(let y=oy-3;y<=oy+3;y++)for(let x=ox-4;x<=ox+4;x++)if(inb(x,y)&&Math.hypot((x-ox)/1.4,y-oy)<2.6+R()*.8)terr[y*MW+x]=1;
  // wadi
  let cx=Math.floor(rnd(10,15));
  for(let y=0;y<MH;y++){ if(R()<.4)cx=clamp(cx+(R()<.5?-1:1),5,19); wadiX[y]=cx;
    terr[y*MW+cx]=2; terr[y*MW+cx+1]=2; if(R()<.35)terr[y*MW+cx+2]=2; if(R()<.2)terr[y*MW+cx-1]=2; }
  // oasis
  for(let y=5;y<MH-2;y++)for(let x=0;x<MW;x++){ const i=y*MW+x; if(terr[i])continue;
    const d=Math.abs(x-wadiX[y]-.5); if(d<4.5 && R()<.75-d*.1)terr[i]=3; }
}
function add(t,x,y,done=true){
  const o=T[t]; const b={id:S.nid++,t,x,y,w:o.w,h:o.h,prog:done?1:0,conn:false,cov:{},hap:50};
  for(let j=0;j<o.h;j++)for(let i=0;i<o.w;i++)occ[(y+j)*MW+x+i]=b.id;
  S.b.push(b); dirty=true; return b;
}
function free(x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(!inb(x+i,y+j)||occ[(y+j)*MW+x+i]||terr[(y+j)*MW+x+i]===1)return false;}return true;}
function seedTown(){
  for(let x=0;x<MW;x++)add('hwy',x,MH-1);
  const tx=wadiX[22]+4, ms=tx+5;

// ================= placement =================
function cost(t){return Math.round(T[t].c*(S.ed.hamad?1.3:1));}
function count(t,act){return S.b.reduce((a,b)=>a+(b.t===t&&(!act||active(b))?1:0),0);}
function canPlace(t,x,y){
  const o=T[t]; if(!o||o.fixed)return {ok:false,why:'Not buildable.'};
  if(S.ended)return {ok:false,why:'Game over.'};
  if(x<0||y<0||x+o.w>MW||y+o.h>MH)return {ok:false,why:'Off the map.'};
  let rock=0,wadi=0;
  for(let j=0;j<o.h;j++)for(let i=0;i<o.w;i++){const k=(y+j)*MW+x+i; if(occ[k])return {ok:false,why:'Something is already there.'}; if(terr[k]===1)rock++; if(terr[k]===2)wadi++;}
  if(o.onRock){ if(rock<o.onRock)return {ok:false,why:'A quarry has to bite into the mountain (3+ rock tiles).'}; }
  else if(rock)return {ok:false,why:'That\'s a mountain.'};
  if(o.onlyWadi&&!wadi)return {ok:false,why:'Bridges go on the wadi bed.'};
  if(o.needWadi&&wadi<o.needWadi)return {ok:false,why:'A dam has to sit across the wadi (2+ wadi tiles).'};
  if(t==='falaj'){let okk=wadi>0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(inb(xx,yy)&&(terr[yy*MW+xx]===1||terr[yy*MW+xx]===2))okk=true;}
    if(!okk)return {ok:false,why:'A falaj needs a source: touch the wadi or the mountain.'};}
  if(o.one&&count(t))return {ok:false,why:'You only get one of those.'};
  if(o.max&&count(t)>=o.max)return {ok:false,why:`Max ${o.max}. Even you have limits.`};
  if(o.needFav&&S.favour<o.needFav)return {ok:false,why:`Muscat favour must be ${o.needFav}+. It's ${Math.round(S.favour)}.`};
  if(S.treasury<cost(t))return {ok:false,why:`Costs ${cost(t)}k. You have ${f0(S.treasury)}k.`};
  return {ok:true,wadi};
}
function place(t,x,y,quiet){
  const c=canPlace(t,x,y); if(!c.ok){if(!quiet)log(c.why,'b');return false;}
  S.treasury-=cost(t); const b=add(t,x,y,false); S.stat.built++;
  if(c.wadi&&!T[t].road&&t!=='dam'&&t!=='falaj'&&!quiet)log(`You built a ${T[t].n.toLowerCase()} <b>in the wadi bed</b>. Bold. The wadi has noted it.`,'b',true);
  return b;
}
function bulldoze(x,y){

  if(T_(b).fixed){log(`You can't bulldoze the ${T_(b).n.toLowerCase()}.`,'b');return false;}
  const c=T_(b).road?0:1; if(S.treasury<c){log('Can\'t even afford the bulldozer.','b');return false;}

}
function remove(b){for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)occ[(b.y+j)*MW+b.x+i]=0; S.b=S.b.filter(q=>q!==b); dirty=true; if(sel===b)sel=null;}
function restoreFort(){
  const f=S.b.find(b=>b.t==='ruin'); if(!f)return; const cc=Math.round(90*(S.ed.hamad?1.3:1));
  if(S.treasury<cc){log(`Restoring the fort costs ${cc}k.`,'b');return;}
  S.treasury-=cc; f.t='fort'; f.prog=0; dirty=true; log('Fort restoration started. The goats living in it have been served notice.','g',true);
}

// ================= derived =================
function active(b){return b.prog>=1&&(T_(b).noRoad||T_(b).road||b.conn);}
function capacity(){return S.b.reduce((a,b)=>a+(T_(b).cap&&active(b)?T_(b).cap:0),0);}
function recompute(){
  dirty=false;
  // road connectivity from the highway
  conn=new Uint8Array(MW*MH); const q=[];
  for(const b of S.b)if(b.t==='hwy'){conn[b.y*MW+b.x]=1;q.push(b.y*MW+b.x);}
  const isRoad=k=>{const id=occ[k];if(!id)return false;const b=byId(id);return b&&T_(b).road&&b.prog>=1;};
  while(q.length){const k=q.pop(),x=k%MW,y=(k/MW)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(!inb(xx,yy))continue;const kk=yy*MW+xx;if(!conn[kk]&&isRoad(kk)){conn[kk]=1;q.push(kk);}}}
  for(const b of S.b){
    if(T_(b).road){b.conn=!!conn[b.y*MW+b.x];continue;}
    let c=false;
    for(let i=-1;i<=b.w&&!c;i++)for(let j=-1;j<=b.h&&!c;j++){ if((i===-1||i===b.w)===(j===-1||j===b.h))continue; const xx=b.x+i,yy=b.y+j; if(inb(xx,yy)&&conn[yy*MW+xx])c=true; }
    b.conn=c;
  }

  for(const b of S.b){const p=T_(b).poll;if(!p||!active(b))continue;const cx=b.x+b.w/2,cy=b.y+b.h/2,r=p;
    for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){if(!inb(x,y))continue;const d=Math.hypot(x+.5-cx,y+.5-cy);if(d<r)poll[y*MW+x]+=(1-d/r)*p/4;}}
  // coverage

  for(const h of homes)h.cov={edu:0,health:0,police:0,faith:0,fun:0};
  for(const b of S.b){const o=T_(b);if(!o.cov||!active(b))continue;const cx=b.x+b.w/2,cy=b.y+b.h/2;
    const inR=homes.filter(h=>Math.hypot(h.x+h.w/2-cx,h.y+h.h/2-cy)<=o.r);
    const load=inR.reduce((a,h)=>a+T_(h).cap*fill,0)||1; const st=o.jobs?C.staff:1; const ratio=Math.min(1,o.capR*st/load);
    for(const h of inR)h.cov[o.cov]+=ratio;}
  // per-home spatial happiness
  let tot=0,w=0; const cv={edu:0,health:0,police:0,faith:0,fun:0};
  for(const h of homes){for(const k in h.cov)h.cov[k]=Math.min(1,h.cov[k]);
    let v=50+h.cov.edu*12-4+h.cov.health*12-5+h.cov.police*5-2+h.cov.faith*7-2+h.cov.fun*9-3;
    let pl=0,palm=0;for(let j=0;j<h.h;j++)for(let i=0;i<h.w;i++){pl+=poll[(h.y+j)*MW+h.x+i];}
    for(let j=-1;j<=h.h;j++)for(let i=-1;i<=h.w;i++){const xx=h.x+i,yy=h.y+j;if(inb(xx,yy)&&terr[yy*MW+xx]===3&&!occ[yy*MW+xx])palm++;}
    v-=pl/(h.w*h.h)*9; v+=Math.min(4,palm);
    if(isWadi(h.x,h.y))v-=3;
    h.sp=v; const n=T_(h).cap; tot+=v*n; w+=n; for(const k in cv)cv[k]+=h.cov[k]*n;}
  S.HB=w?tot/w:40; for(const k in cv)cv[k]=w?cv[k]/w:0; S.cov=cv;
}
const _byId=new Map();
function byId(id){for(const b of S.b)if(b.id===id)return b;return null;}

function calc(){
  const C={}, W=S.W, e=S.ed;
  let cap=0,jobs=0,pow=0,pw=0,wat=0,wuse=0,attr=0; const n={};
  for(const b of S.b){const o=T_(b);const a=active(b);n[b.t]=(n[b.t]||0)+(a?1:0); if(!a)continue;
    cap+=o.cap||0; jobs+=o.jobs||0; pw+=o.pw||0; attr+=o.attr||0;
    if(o.water<0)wuse-=o.water; }
  jobs+=20+S.pop*0.04;
  C.n=n; C.cap=cap||1; C.jobs=jobs; C.attr=attr;
  C.work=S.pop*0.3; C.staff=jobs?Math.min(1,C.work/jobs):1; C.emp=C.work>0?Math.min(1,jobs/C.work):1;
  const aqF=Math.sqrt(S.aquifer/100);
  for(const b of S.b){if(!active(b))continue;const o=T_(b);
    if(b.t==='genset')pow+=60*Math.max(.3,C.staff); else if(b.t==='solar')pow+=55*(W.dust?.25:1); else if(b.t==='grid')pow+=200;

  add('crime',-(S.crime-15)*0.3);

function facTarget(k){

  const a=(l,x)=>{v+=x;if(Math.abs(x)>=.5)why.push([l,x]);};
  if(k==='elders'){a('mosque coverage',(cv.faith||0)*22-10);a('the fort',n.fort?14:-2);a('aquifer',(S.aquifer-50)*0.3);
    a('hotels',-(n.hotel||0)*5);a('apartment blocks',-(n.flats||0)*3);a('ski slope',n.ski?-25:0);a('curfew',e.curfew?10:0);
    a('borewells',-(n.well||0)*3);a('crime',-(S.crime-15)*0.4);a('Hamad',e.hamad?-5:0);}
  if(k==='youth'){a('jobs',(C.emp-0.92)*170);a('leisure coverage',(cv.fun||0)*22-10);a('shawarma',Math.min(n.shawarma||0,8)*2-4);
    a('football',(n.pitch||0)?6:-3);a('ski slope',n.ski?22:0);a('hotels',(n.hotel||0)*2);a('curfew',e.curfew?-22:0);a('schools',(cv.edu||0)*12-6);}
  if(k==='merchants'){a('souqs',Math.min((n.souq||0)*7,21)-8);a('fees',[12,0,-18][e.fees]);a('Hamad\'s contracts',e.hamad?-16:0);
    a('tourism',Math.min(20,C.attr*0.12*Math.min(1,(n.hotel||0))));a('Friday market',e.friday?9:0);a('petrol stations',Math.min(2,n.petrol||0)*3);
    const un=S.b.filter(b=>!T_(b).noRoad&&!T_(b).road&&b.prog>=1&&!b.conn).length;a('buildings with no road',-un*3);a('villas',Math.min(3,n.villa||0)*2);}

    a('goat pens',Math.min(3,n.goats||0)*3);a('quarries',-(n.quarry||0)*9);a('aquifer',(S.aquifer-50)*0.35);a('dams',(n.dam||0)*6);

// ================= weather =================
function doy(){return S.day%365;}
function weather(){
  const W=S.W,d=doy();
  const base=33+12*Math.sin(2*Math.PI*(d-105)/365);
  if(W.wave>0)W.wave--;
  else if(base>40&&R()<0.006){W.wave=8+Math.floor(rnd(10));W.waveAdd=rnd(4,8);log(`<b>Heatwave.</b> ${Math.round(base+W.waveAdd)}° for ${W.wave} days. Every AC in town just went to max.`,'b',true);}
  W.heat=Math.round(base+(W.wave?W.waveAdd:0)+rnd(-1.5,1.5));
  const winter=d<80||d>335, cyc=(d>140&&d<180)||(d>285&&d<330);
  let rain=(winter?14:4)+rnd(-3,4);
  if(W.storm>0){W.storm--;rain=W.stormRain*rnd(.8,1.1);}
  else if(R()<(cyc?0.01:winter?0.006:0.002)){W.storm=4+Math.floor(rnd(5));W.stormRain=cyc?rnd(80,100):rnd(55,80);
    log(`${cyc?'<b>Cyclone</b>':'<b>Big storm</b>'} incoming. ${Math.round(W.stormRain)} mm/wk for ${W.storm} days. The wadi is waking up.`,'b',true);}
  W.rain=Math.round(clamp(rain,0,100));
  if(W.dust>0)W.dust--;
  else if(S.grass<18&&W.heat>40&&W.rain<10&&R()<0.05){W.dust=3+Math.floor(rnd(4));once('dust',12,()=>log(`Grass is gone, ${W.heat}° → <b>dust storm</b>. Solar panels buried, drivers blind.`,'b',true));}
}

// ================= the day =================
const cd={};
function once(k,days,fn){if((cd[k]||-1)>S.day)return;cd[k]=S.day+days;fn();}
function mod(f,a,d){S.mods.push({f,a,d});}
function step(){

  for(const b of S.b)if(b.prog<1){b.prog=Math.min(1,b.prog+(e.hamad?2:1)/(T_(b).bd||20));if(b.prog>=1){dirty=true;onBuilt(b);}}
  if(dirty||S.day%7===0)recompute();
  const C=calc(); S.C=C;
  // power

  if(C.pR<1&&R()<(1-C.pR)*2+0.05){bo=1;S.stat.blackouts++;
    once('bo',20,()=>log(`${W.heat}° outside, ${f0(C.pDem)} MW wanted, ${f0(C.pSup)} MW available → <b>BLACKOUT</b>.`,'b',true));
    if(W.heat>34&&(C.n.shawarma||0)&&R()<.25)once('rot',20,()=>{log(`No power + ${W.heat}° = the shawarma chicken went off. Half the youth are living on the toilet.`,'b',true);mod('youth',-6,25);});}

  if(C.wR<.85)once('dry',30,()=>log(`Water: ${f0(C.wSup)} supply vs ${f0(C.wDem)} demand. Taps cough. The falaj is a rumour.`,'b',true));
  if(S.aquifer<20)once('aq',90,()=>log(`The aquifer is at <b>${Math.round(S.aquifer)}%</b>. The falaj is drying up. Old Saif says he told you so.`,'b',true));
  // grass & goats
  S.grass+=(15+S.aquifer*0.35+W.rain*0.8-C.goats*0.035-S.grass)*0.02; S.grass=clamp(S.grass,0,100);
  if(S.grass<20){const b4=S.feral;S.feral+=(C.goats-S.feral)*0.006;if(b4<20&&S.feral>=20){log(`Grass at ${Math.round(S.grass)}%, ${f0(C.goats)} hungry goats → the goats have <b>gone feral</b>.`,'b',true);mod('all',-3,30);}}

  S.cats+=(S.trash*0.6-S.cats)*0.02;
  if(S.cats>55)once('cats',40,()=>log(`<b>${Math.round(S.cats)} cats</b>. They're unionising around the trash. Build a garbage depot or meet their demands.`,'b',true));
  const pc=S.cov?S.cov.police:0;
  S.crime+=(12+(1-C.emp)*130+S.pop/180+(C.n.shawarma||0)*.3-pc*28-(e.curfew?9:0)-S.crime)*0.03; S.crime=Math.max(0,S.crime);

  S.favour=clamp(S.favour+(50-S.favour)*0.004-bo*0.2-(S.treasury<0?0.15:0)+(C.H>55?0.02:0),0,100);
  if(e.hamad)S.scandal+=0.004;
  if(S.scandal>1&&R()<0.015){S.scandal=0;S.stat.scandals++;mod('all',-14,90);S.favour-=15;
    log(`<b>SCANDAL.</b> A WhatsApp voice note reveals Hamad got ${pick(['the road contract','the school contract','the falaj repair money','a Prado from the municipality budget'])}. Approval tanks, Muscat is not amused.`,'b',true);}
  S.day++;

function flood(){
  const C=S.C, sev=clamp(S.flow/80,0.4,1.4); S.stat.floods++;
  const dams=S.b.filter(b=>b.t==='dam'&&active(b));
  if(dams.length){S.aquifer=clamp(S.aquifer+6*dams.length,0,100);}
  let lost=[],fords=0;
  for(const b of [...S.b]){
    if(b.t==='hwy'||b.t==='dam'||b.t==='bridge'||T_(b).fixed)continue;
    let wd=0,near=0;
    for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++){const x=b.x+i,y=b.y+j; if(isWadi(x,y))wd++; else if(isWadi(x-1,y)||isWadi(x+1,y))near++;}
    if(!wd&&!near)continue;
    const shield=dams.some(d=>d.y<b.y)?0.3:1;
    let p=(wd?0.55:0.12)*sev*shield; if(b.t==='falaj')p*=.4;
    if(b.t==='road'&&wd)fords++;
    if(R()<p){lost.push(b);remove(b);}
  }
  S.stat.destroyed+=lost.length;
  const sw=Math.round(fords*S.pop/400*rnd(.5,1.5)*(S.warned?.4:1)*sev);
  if(sw>0){S.swallowed+=sw;S.treasury-=sw*3;}
  const names={};lost.forEach(b=>names[T_(b).n]=(names[T_(b).n]||0)+1);
  const list=Object.entries(names).map(([k,v])=>`${v} ${k.toLowerCase()}`).join(', ');
  log(`<b>THE WADI IS FLOWING.</b> ${lost.length?`It took ${list}.`:'Nothing important was in its way.'}${sw?` ${sw} geniuses drove their Prado into it anyway (−${sw*3}k for Civil Defence).`:''}${dams.length?' Your dam caught the worst of it and refilled the aquifer.':''}`,'b',true);
  if(lost.length)mod('all',-Math.min(10,lost.length*1.5),40);
}
function month(){
  const C=S.C,n=C.n,e=S.ed,st=C.staff,inc={},exp={};
  const rich=S.b.filter(b=>b.t==='villa'&&active(b)).length*24, fillR=S.pop/C.cap;
  inc['Fees']=(S.pop*0.03+rich*fillR*0.06)*[0.5,1,1.7][e.fees];
  inc['Souq rent']=(n.souq||0)*2.2*st*Math.min(1,S.pop/((n.souq||1)*350));
  inc['Shawarma licences']=(n.shawarma||0)*0.35;
  let farm=0;for(const b of S.b)if(b.t==='farm'&&active(b)){let pal=0;for(let j=0;j<2;j++)for(let i=0;i<2;i++)if(terr[(b.y+j)*MW+b.x+i]===3)pal++;farm+=3*(pal>=2?1.6:1);}
  inc['Dates']=farm*Math.min(1,C.wR)*st*(1-Math.min(.5,S.feral/600));
  inc['Goats']=(n.goats||0)*0.6;
  inc['Quarry']=(n.quarry||0)*7*st;
  inc['Petrol']=(n.petrol||0)*Math.min(3,S.pop*0.003/Math.max(1,n.petrol||0)*(n.petrol||0))/Math.max(1,n.petrol||0)*(n.petrol||0);
  inc['Tourism']=(n.hotel||0)*(1+C.attr*0.05)*st*(C.pR<1?.7:1);
  exp['Upkeep']=S.b.reduce((a,b)=>a+(b.prog>=1?(T_(b).up||0):0),0);
  if(e.subsidy)exp['Power subsidy']=S.pop*0.008;
  if(e.friday)exp['Friday market']=2;
  if(e.curfew)exp['Curfew overtime']=0.6;
  if(e.hamad)exp['"Consulting" (Hamad)']=3;
  let ti=0,te=0;for(const k in inc)ti+=inc[k];for(const k in exp)te+=exp[k];
  S.treasury+=ti-te; S.books={inc,exp,ti,te};
  if(S.treasury<0)once('broke',60,()=>log(`Treasury is at <b>${f0(S.treasury)}k</b>. The auditor in Muscat just opened a new folder with your name on it. Under −150k you're done.`,'b',true));
}

const timers=[];
function setTimeout0(fn,days){timers.push({at:S.day+days,fn});}
function runTimers(){for(let i=timers.length-1;i>=0;i--)if(timers[i].at<=S.day){timers[i].fn();timers.splice(i,1);}}
let lastEv=null;
function fireEvent(){
  const pool=EVENTS.filter(e=>e.id!==lastEv&&e.w()>0); if(!pool.length)return;
  let tot=pool.reduce((a,e)=>a+e.w(),0),r=rnd(tot),ev=pool[0];
  for(const e of pool){r-=e.w();if(r<=0){ev=e;break;}}
  lastEv=ev.id; S.events++;
  S.pending={kind:'event',h:ev.t,sub:dateStr().toUpperCase()+' · DECISION',p:ev.b(),
    opts:ev.o.map(o=>({t:o.t,h:o.h,f:()=>{const m=o.f();log(`<b>${ev.t}.</b> ${m}`,'e',true);}}))};
  showPending();
}

function spark(){const c=$('spark'),dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;if(!W)return;if(c.width!==Math.round(W*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);}

  if(u)R_(px+m,py,TS-2*m,m,col);if(d)R_(px+m,py+TS-m,TS-2*m,m,col);if(l)R_(px,py+m,m,TS-2*m,col);if(r)R_(px+TS-m,py+m,m,TS-2*m,col);
  if(hw){R_(px,py+2,TS,TS-4,col);if((b.x%2)===0)R_(px+3,py+7,6,1,'#e2c23a');}
  else if(!w&&b.t!=='bridge'){if((l||r)&&!(u||d))R_(px+5,py+7,3,1,'#bbb');if((u||d)&&!(l||r))R_(px+7,py+5,1,3,'#bbb');}
  if(b.t==='bridge'){R_(px+3,py+2,1,12,'#ddd');R_(px+12,py+2,1,12,'#ddd');}
  if(b.prog<1){g.fillStyle='#ffd23d55';g.fillRect(px,py,TS,TS);}
}
function sprite(b){
  const o=T_(b),px=b.x*TS,py=b.y*TS,W=b.w*TS,H=b.h*TS,bo=S.bo[S.bo.length-1];
  if(o.road)return drawRoad(b);
  if(b.prog<1){R_(px+1,py+1,W-2,H-2,'#6b5640');g.strokeStyle='#e2c23a';g.lineWidth=1;for(let i=-H;i<W;i+=5){g.beginPath();g.moveTo(px+i,py+H);g.lineTo(px+i+H,py);g.stroke();}
    R_(px+1,py+H-4,W-2,3,'#000');R_(px+1,py+H-4,(W-2)*b.prog,3,'#8fd16a');return;}
  R_(px+2,py+3,W-2,H-2,'#00000033');
  const win=bo?'#222':'#3b5a7a';
  switch(b.t){
    case 'house':{const c=['#e8dcc0','#d8c9a8','#efe6d2','#c9b590'][b.id%4];R_(px+2,py+2,12,11,c);R_(px+2,py+2,12,2,'#fff6');R_(px+4,py+6,2,2,win);R_(px+9,py+6,2,2,win);R_(px+6,py+9,3,4,'#7a5638');R_(px+10,py+1,3,2,'#ddd');R_(px+3,py+1,2,1,'#999');break;}
    case 'villa':R_(px+2,py+2,W-4,H-6,'#f2ead8');R_(px+2,py+2,W-4,3,'#c9a86e');for(let i=0;i<4;i++)R_(px+5+i*6,py+9,3,4,win);R_(px+4,py+H-6,W-8,4,'#5fa0d0');R_(px+W-8,py+H-12,4,6,'#3f8a3a');break;
    case 'flats':R_(px+3,py+1,W-6,H-3,'#c8c0b0');for(let j=0;j<5;j++)for(let i=0;i<4;i++)R_(px+6+i*6,py+3+j*5,3,3,win);R_(px+3,py+1,W-6,2,'#a89c88');for(let i=0;i<4;i++)R_(px+5+i*6,py-1,3,2,'#ddd');break;
    case 'falaj':R_(px,py,TS,TS,'#a8875a');R_(px+3,py,10,TS,'#7d5f3c');R_(px+5,py,6,TS,S.aquifer>10?'#4f88c9':'#6a5a40');if(S.aquifer>10)R_(px+6,py+((frame>>1)%TS),2,2,'#cfe6ff');break;
    case 'well':R_(px+3,py+3,10,10,'#8a8580');R_(px+5,py+5,6,6,S.aquifer>3?'#2a4f7a':'#3a3028');R_(px+7,py,2,4,'#555');break;
    case 'tanker':R_(px+2,py+2,W-4,H-4,'#9a9a9a');for(let i=0;i<3;i++){R_(px+4,py+5+i*8,20,6,'#e8e8e8');R_(px+4,py+6+i*8,14,4,'#6fb3ff');}break;
    case 'dam':R_(px,py+4,W,H-8,'#b8b0a0');R_(px,py+4,W,2,'#ddd');R_(px+3,py+H-4,W-6,4,'#4f88c9');break;
    case 'genset':R_(px+2,py+4,W-4,H-6,'#7d7a74');R_(px+4,py+7,10,8,'#5a5a5a');R_(px+17,py+7,10,8,'#5a5a5a');R_(px+22,py,3,6,'#555');
      if(!bo)for(let i=0;i<3;i++)R_(px+22+Math.sin(frame*.05+i)*2,py-3-i*4-((frame/6)%4),3,3,'#bbb9');break;
    case 'solar':for(let j=0;j<3;j++)for(let i=0;i<3;i++){R_(px+2+i*15,py+3+j*15,12,9,S.W.dust?'#a08060':'#2a3f6a');R_(px+2+i*15,py+3+j*15,12,1,'#8aa0d0');}break;
    case 'grid':R_(px+2,py+2,W-4,H-4,'#5a5a5a');for(let i=0;i<3;i++)R_(px+5+i*8,py+5,4,18,'#c8c8c8');R_(px+3,py+12,W-6,1,'#ffd23d');break;
    case 'depot':R_(px+2,py+3,W-4,H-5,'#5f6a4a');R_(px+4,py+18,10,6,'#2f6a2f');R_(px+17,py+18,10,6,'#2f6a2f');R_(px+5,py+5,20,10,'#7a8a5a');break;
    case 'school':R_(px+2,py+5,W-4,H-7,'#e8d070');R_(px+2,py+5,W-4,2,'#c9a83a');for(let i=0;i<4;i++)R_(px+5+i*6,py+11,3,4,win);R_(px+14,py+19,4,8,'#7a5638');R_(px+26,py,1,8,'#555');R_(px+27,py,4,3,'#c33');break;
    case 'clinic':R_(px+2,py+3,W-4,H-5,'#f4f4f4');R_(px+12,py+8,8,2,'#d22');R_(px+15,py+5,2,8,'#d22');for(let i=0;i<4;i++)R_(px+5+i*6,py+18,3,3,win);break;
    case 'police':R_(px+2,py+3,12,10,'#e8e8f4');R_(px+2,py+3,12,3,'#2a4f9a');R_(px+6,py+1,3,2,frame%30<15?'#d22':'#22d');break;
    case 'mosque':R_(px+3,py+10,W-6,H-12,'#f2efe6');g.fillStyle='#3f9a6a';g.beginPath();g.arc(px+16,py+11,7,Math.PI,0);g.fill();R_(px+25,py+1,4,H-3,'#f2efe6');R_(px+25,py,4,2,'#3f9a6a');R_(px+13,py+20,6,8,'#7a5638');break;
    case 'park':R_(px+1,py+1,14,14,'#5f9a3a');drawPalm(px+8,py+12);R_(px+2,py+12,5,2,'#8a6a44');break;
    case 'pitch':R_(px+1,py+1,W-2,H-2,'#3f8a3a');g.strokeStyle='#fff';g.lineWidth=1;g.strokeRect(px+3.5,py+3.5,W-7,H-7);R_(px+16,py+4,1,H-8,'#fff');R_(px+1,py+1,2,2,'#ffe95a');R_(px+W-3,py+1,2,2,'#ffe95a');break;
    case 'souq':R_(px+2,py+4,W-4,H-6,'#d8b880');for(let i=0;i<3;i++){R_(px+3+i*9,py+4,8,5,['#c0392b','#e67e22','#2a7a9a'][i]);R_(px+5+i*9,py+12,4,6,'#5a3a20');}R_(px+3,py+21,W-6,2,'#a07840');break;
    case 'shawarma':R_(px+2,py+5,12,8,'#a3261c');R_(px+2,py+3,12,2,'#f5d27a');R_(px+6,py+7,3,5,bo?'#3a3':(frame%10<5?'#ff9a2a':'#ffcc4a'));break;
    case 'farm':for(let j=0;j<2;j++)for(let i=0;i<2;i++)drawPalm(px+5+i*14,py+13+j*14);R_(px,py+H-2,W,1,'#4f88c9');break;
    case 'goats':g.strokeStyle='#8a6a44';g.strokeRect(px+2.5,py+2.5,W-5,H-5);for(let i=0;i<5;i++){const gx=px+5+((i*7+frame*.2*(i%2?1:-1))%20+20)%20,gy=py+6+i*4;R_(gx,gy,3,2,i%2?'#f4efe6':'#7a5638');}break;
    case 'quarry':R_(px+2,py+2,W-4,H-4,'#8f8f8a');R_(px+8,py+8,W-16,H-16,'#6a6a66');R_(px+14,py+14,W-28,H-28,'#55554f');R_(px+4,py+H-8,8,5,'#e2c23a');
      for(let i=0;i<3;i++)R_(px+20+Math.sin(frame*.04+i)*4,py+6-i*3-((frame/8)%3),4,3,'#c8b89a88');break;
    case 'petrol':R_(px+1,py+3,14,3,'#d22');R_(px+3,py+6,1,8,'#999');R_(px+12,py+6,1,8,'#999');R_(px+6,py+9,4,5,'#ffd23d');break;
    case 'hotel':R_(px+2,py+1,W-4,H-4,'#c9a86e');R_(px+2,py+1,W-4,2,'#a07840');for(let j=0;j<3;j++)for(let i=0;i<4;i++)R_(px+5+i*6,py+5+j*6,3,3,win);R_(px+4,py+H-6,W-8,3,'#5fa0d0');break;
    case 'dallah':R_(px+5,py+5,7,9,'#e2b23a');R_(px+6,py+2,5,3,'#e2b23a');R_(px+8,py,1,2,'#e2b23a');R_(px+12,py+5,3,2,'#e2b23a');R_(px+2,py+12,3,3,'#5f9a3a');break;
    case 'ski':g.fillStyle='#e8eef6';g.beginPath();g.moveTo(px+2,py+H-2);g.lineTo(px+W-2,py+H-2);g.lineTo(px+W-2,py+3);g.lineTo(px+W-14,py+3);g.closePath();g.fill();R_(px+W-12,py+1,10,3,'#9fc7ef');R_(px+W-6,py-3,2,4,'#ff3b6b');break;
    case 'ruin':R_(px+2,py+4,W-4,H-6,'#9a7a5a');R_(px+4,py+2,8,6,'#8a6a4a');R_(px+W-10,py+10,8,8,'#7a5a3a');R_(px+18,py+20,8,4,'#6a4a2a');R_(px+10,py+16,3,2,'#f4efe6');break;
    case 'fort':R_(px+3,py+6,W-6,H-8,'#c49a6a');for(let i=0;i<8;i++)R_(px+3+i*6,py+4,3,2,'#c49a6a');R_(px+2,py+2,10,12,'#b88a5a');R_(px+W-12,py+2,10,12,'#b88a5a');R_(px+20,py+H-10,8,8,'#5a3a20');R_(px+24,py-2,1,6,'#555');R_(px+25,py-2,5,3,'#c33');break;
  }
  if(!active(b)&&frame%40<24){R_(px+W-7,py,6,7,'#d22');R_(px+W-5,py+1,2,3,'#fff');R_(px+W-5,py+5,2,1,'#fff');}
}
let fer=[];
function draw(){
  frame++;
  drawTerrain();
  for(const b of S.b)if(T_(b).road)sprite(b);
  for(const b of S.b)if(!T_(b).road)sprite(b);
  // feral goats
  const nF=Math.min(80,Math.round(S.feral/6));while(fer.length<nF)fer.push({x:rnd(MW*TS),y:rnd(MH*TS),vx:rnd(-.4,.4),vy:rnd(-.4,.4)});fer.length=nF;
  fer.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(Math.random()<.02){o.vx=rnd(-.4,.4);o.vy=rnd(-.4,.4);}o.x=(o.x+MW*TS)%(MW*TS);o.y=(o.y+MH*TS)%(MH*TS);R_(o.x,o.y,3,2,'#f4efe6');R_(o.x+3,o.y-1,1,1,'#ff2020');});
  // cats near trash
  const nC=Math.min(60,Math.round(S.cats/2));for(let i=0;i<nC;i++){const h=S.b[(i*37)%S.b.length];if(!h)break;R_(h.x*TS+((i*5+frame*.1)%14),h.y*TS+14,2,1,i%3?'#2a2522':'#d08a3a');}
  // overlays
  if(overlay!=='none')drawOverlay();
  if(S.W.heat>45&&S.W.rain<5){g.fillStyle=`rgba(255,170,80,${(S.W.heat-45)/50})`;g.fillRect(0,0,cv.width,cv.height);}
  if(S.W.dust){g.fillStyle='rgba(180,130,70,.45)';g.fillRect(0,0,cv.width,cv.height);}
  if(S.bo[S.bo.length-1]){g.fillStyle='rgba(0,0,30,.35)';g.fillRect(0,0,cv.width,cv.height);}
  if(S.W.rain>20){g.fillStyle='#bcd8ff88';for(let i=0;i<S.W.rain*3;i++){const x=(i*97+frame*3)%cv.width,y=(i*53+frame*9)%cv.height;g.fillRect(x,y,1,4);}}
  // hover preview
  if(hover&&tool&&T[tool]){
    const pts=drag&&dragTool(tool)?linePts(drag.a,hover):[tool==='road'||tool==='house'?hover:anchor(tool,hover)];
    for(const p of pts){const c=canPlace(tool,p.x,p.y);const o=T[tool];g.fillStyle=c.ok?'#8fd16a66':'#ff5a4e66';g.fillRect(p.x*TS,p.y*TS,o.w*TS,o.h*TS);}
    const o=T[tool];if(o.r){const a=anchor(tool,hover);g.strokeStyle='#ffd23d';g.setLineDash([4,3]);g.beginPath();g.arc((a.x+o.w/2)*TS,(a.y+o.h/2)*TS,o.r*TS,0,7);g.stroke();g.setLineDash([]);}
  } else if(hover&&tool==='bulldoze'){const pts=drag?linePts(drag.a,hover):[hover];g.fillStyle='#ff5a4e55';pts.forEach(p=>g.fillRect(p.x*TS,p.y*TS,TS,TS));}
  if(sel&&S.b.includes(sel)){g.strokeStyle='#fff';g.lineWidth=1;g.strokeRect(sel.x*TS+.5,sel.y*TS+.5,sel.w*TS-1,sel.h*TS-1);const o=T_(sel);if(o.r){g.strokeStyle='#ffd23d';g.setLineDash([4,3]);g.beginPath();g.arc((sel.x+sel.w/2)*TS,(sel.y+sel.h/2)*TS,o.r*TS,0,7);g.stroke();g.setLineDash([]);}}
  const ban=[];if(S.bo[S.bo.length-1])ban.push('⚡ BLACKOUT');if(S.W.dust)ban.push('dust storm');if(S.flow>10)ban.push('WADI FLOWING');if(S.W.storm)ban.push('storm');if(S.W.wave)ban.push('heatwave');
  if(overlay!=='none')ban.push('overlay: '+OVLS.find(o=>o[0]===overlay)?.[1]);
  $('banner').textContent=ban.join(' · ');$('banner').style.display=ban.length?'':'none';
}
function drawOverlay(){
  g.fillStyle='#00000066';g.fillRect(0,0,cv.width,cv.height);
  if(overlay==='poll'){for(let k=0;k<MW*MH;k++){const p=poll[k];if(p>.05){g.fillStyle=`rgba(160,110,60,${Math.min(.85,p/3)})`;g.fillRect((k%MW)*TS,((k/MW)|0)*TS,TS,TS);}}return;}
  if(overlay==='flood'){for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const w=isWadi(x,y),n=!w&&(isWadi(x-1,y)||isWadi(x+1,y));if(w||n){g.fillStyle=w?'#4f88c9aa':'#4f88c955';g.fillRect(x*TS,y*TS,TS,TS);}}return;}
  for(const b of S.b){if(!T_(b).cap)continue;let v;
    if(overlay==='hap')v=clamp(((b.sp||40)-30)/40,0,1);else{const k=overlay.slice(4);v=b.cov?b.cov[k]||0:0;}
    g.fillStyle=`rgba(${Math.round(lerp(255,90,v))},${Math.round(lerp(70,220,v))},70,.85)`;g.fillRect(b.x*TS+2,b.y*TS+2,b.w*TS-4,b.h*TS-4);}
  if(overlay.startsWith('cov:')){const k=overlay.slice(4);for(const b of S.b){const o=T_(b);if(o.cov!==k)continue;g.strokeStyle='#ffd23d';g.setLineDash([4,3]);g.beginPath();g.arc((b.x+b.w/2)*TS,(b.y+b.h/2)*TS,o.r*TS,0,7);g.stroke();g.setLineDash([]);}}
}

// ================= loop =================
function start(seed){
  hideCard(); newGame(seed); for(const k in cd)delete cd[k]; timers.length=0; lastEv=null; sel=null; fer=[];
  if(uiOn){$('log').innerHTML='';
    S.pending={kind:'intro',h:'YOU ARE THE WALI',sub:`${S.town.toUpperCase()} · A WILAYAT IN THE INTERIOR`,
    p:`Muscat has handed you ${S.town}: ${f0(S.pop)} people, one generator, two falaj channels, a ruined fort full of goats and a wadi that floods. Three terms, four years each. Every election you need <b>50%</b>.<br><br>
    <b>Build</b> from the left (drag roads and houses). Everything but farms, falaj, gardens, solar and dams needs a road to the highway. <b>Edicts</b> on the right cost wasta. Four factions vote; the reasons they hate you are listed under each bar.<br><br>
    Summer heat doubles power demand. The aquifer only goes down unless it rains. Upkeep is forever. Muscat sends money once a year and orders whenever it likes. Your cousin Hamad is always nearby.<br><br>
    <span style="color:var(--dim)">Keys: space pause · 1/2/3 speed · R road · H houses · B bulldoze · right-click/Esc cancel.</span>`,
    opts:[{t:'Take the oath',h:'Game starts paused-ish at 1×. Jan, Year 1.',f:()=>log(`You took the oath. ${S.town} is cautiously optimistic. The goats are not.`,'m')}]};
    showPending(); uiTick(true);}
}
let acc=0,last=performance.now(),uiT=0;
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(speed&&!S.pending&&!S.ended){acc+=dt*speed*2/1000;let n=0;while(acc>=1&&n<20&&!S.pending&&!S.ended){step();runTimers();acc-=1;n++;}}else acc=0;
  draw();
  if(now-uiT>200){uiT=now;uiTick();}
  requestAnimationFrame(loop);
}
function fit(){const r=$('mapbox').getBoundingClientRect();const s=innerWidth<900?r.width/cv.width:Math.max(.5,Math.min(r.width/cv.width,(r.height||9999)/cv.height));cv.style.width=Math.floor(cv.width*s)+'px';cv.style.height=Math.floor(cv.height*s)+'px';}
window.addEventListener('resize',fit);
buildTools();buildOvl();buildSide();setTool(null);start();fit();requestAnimationFrame(fit);
requestAnimationFrame(loop);

// headless API for balance bots
window.__w={get S(){return S},T,EDICTS,MW,MH,get terr(){return terr},get occ(){return occ},isWadi,canPlace,place,bulldoze,restoreFort,setEdict,answer,active,
  newGame:(s)=>{uiOn=false;newGame(s);for(const k in cd)delete cd[k];timers.length=0;lastEv=null;},
  run:(n)=>{let i=0;for(;i<n;i++){if(!step())break;runTimers();}return i;},
  ui:(v)=>{uiOn=v;}, conn:()=>conn, recompute};
})();
</script>
